name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check data.js
          node --check calc.js
          node --check api.js
          node --check render.js
          node --check app.js
          node --check sw.js
      - name: Unit tests
        run: node --test
